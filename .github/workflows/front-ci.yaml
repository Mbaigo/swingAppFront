name: Build frontend Vue.js

on:
  push:
    branches: ['develop', 'main']
  pull_request:
    branches: ['develop', 'main']

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Requis pour l'analyse SonarCloud

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Version LTS recommandée pour Vue 3 / Vite
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project (TypeScript & Vue)
        # Vérifie que le code compile parfaitement
        run: npm run build

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
